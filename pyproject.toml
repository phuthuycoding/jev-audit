[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-cli"
version = "0.1.0"
description = "AI-powered pre-commit guardrail backed by TypeSafe System One (Jev)"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
guardrail = "main:app"

[tool.setuptools]
py-modules = ["main"]
